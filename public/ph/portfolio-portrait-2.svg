<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200" role="img">

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#0A2239"/>
      <stop offset="0.55" stop-color="#123A5C"/>
      <stop offset="1" stop-color="#1F4E75"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F0DFC2" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#E3C79E" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#E3C79E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="veil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06182A" stop-opacity="0.10"/>
      <stop offset="0.6" stop-color="#06182A" stop-opacity="0"/>
      <stop offset="1" stop-color="#06182A" stop-opacity="0.62"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="26"/></filter>
  </defs>

  <rect width="900" height="1200" fill="url(#sky)"/>
  <ellipse cx="558" cy="696" rx="558" ry="528" fill="url(#glow)"/>

  <circle cx="470" cy="520" r="330" fill="#EBD8B8" opacity="0.16" filter="url(#soft)"/>
  <path d="M120,0 h660 a120,120 0 0 1 120,120 v840 a120,120 0 0 1 -120,120 h-660 a120,120 0 0 1 -120,-120 v-840 a120,120 0 0 1 120,-120 z" fill="#0C2740" opacity="0.45"/>
  
  <g transform="translate(480,1080) scale(1.55)" fill="#08192B" opacity="0.95">
    <circle cx="0" cy="-566" r="44"/>
    <path d="M-58,-552 C-104,-520 -128,-424 -152,-140 L-166,0 L166,0 L152,-140 C128,-424 104,-520 58,-552 Z"/>
    <path d="M-104,-618 L0,-660 L104,-618 L0,-576 Z"/>
    <path d="M-104,-618 L104,-618" stroke="#08192B" stroke-width="14" stroke-linecap="round"/>
    <path d="M104,-618 q14,-2 16,26" stroke="#08192B" stroke-width="7" fill="none" stroke-linecap="round"/><circle cx="121" cy="-586" r="9"/>
  </g>
  <path d="M0,1050 C300,1020 600,1060 900,1030 L900,1200 L0,1200 Z" fill="#04121F" opacity="0.8"/>

  <rect width="900" height="1200" fill="url(#veil)"/>
  <rect width="900" height="1200" filter="url(#grain)" opacity="0.5"/>
  <rect x="20" y="20" width="860" height="1160" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" rx="8"/>
</svg>
