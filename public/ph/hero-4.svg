<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200" width="2000" height="1200" role="img">

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#071A2E"/>
      <stop offset="0.45" stop-color="#12324C"/>
      <stop offset="1" stop-color="#2C5E73"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F6E6C8" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#E8C99B" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#E8C99B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#04121F" stop-opacity="0.62"/>
      <stop offset="0.55" stop-color="#04121F" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#04121F" stop-opacity="0.48"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
    </filter>
    <filter id="blurXL"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="blurM"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="blurS"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>


  <rect width="2000" height="1200" fill="#0A1B2C"/>
  <circle cx="1150" cy="520" r="620" fill="url(#sun)" filter="url(#blurXL)"/>
